name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
      - "packages/admin-ui/**"
      - "packages/collector-core/**"
      - "packages/contracts/**"
      - "packages/server-core/**"
      - "packages/server-runtime/**"
      - "packages/storage/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
      - "packages/admin-ui/**"
      - "packages/collector-core/**"
      - "packages/contracts/**"
      - "packages/server-core/**"
      - "packages/server-runtime/**"
      - "packages/storage/**"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            command: build
            artifact_name: nexume-macos-arm64
          - name: Windows x64 Portable
            os: windows-latest
            command: build:portable
            artifact_name: nexume-windows-x64-portable

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Read and validate app version
        id: version
        shell: bash
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version."
            exit 1
          fi

      - name: Build desktop artifact
        run: bun run ${{ matrix.command }}

      - name: Package macOS release asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          mv artifacts/*.dmg "release/Nexume-${{ steps.version.outputs.version }}-macos-arm64.dmg"

      - name: Package Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive `
            -LiteralPath artifacts/portable/Nexume.exe `
            -DestinationPath "release/Nexume-${{ steps.version.outputs.version }}-windows-x64-portable.zip"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: nexume-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads / 下载

          - macOS Apple silicon (ARM64): download the DMG, then drag `Nexume.app` into Applications.
          - Windows x64: extract the portable ZIP and run `Nexume.exe`; no installation is required.

          The macOS build is currently unsigned. After copying the app to Applications, run / 当前 macOS 构建未签名，将应用拖入“应用程序”后请执行：

          ```bash
          sudo xattr -dr com.apple.quarantine /Applications/Nexume.app
          ```
          EOF

          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Nexume ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --generate-notes
