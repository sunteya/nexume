name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-14
            command: build
            artifact_name: nexume-macos-x64
            artifact_path: apps/desktop/artifacts/*.dmg
          - name: Windows x64 Portable
            os: windows-latest
            command: build:portable
            artifact_name: nexume-windows-x64-portable
            artifact_path: apps/desktop/artifacts/portable/Nexume.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build desktop artifact
        run: bun run ${{ matrix.command }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
